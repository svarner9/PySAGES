[build-system]
requires = [
  "cython>=0.29",
  "numpy>=1.16",
  "setuptools>=41.0",
  "setuptools_scm[toml]>=6.0",
  "wheel>=0.33",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running toy/convergence tests (run once; read the printed numbers rather than treating pass/fail as a tight fit gate).",
]

[tool.setuptools_scm]
write_to = "pysages/_version.py"

[tool.black]
line-length = 100
